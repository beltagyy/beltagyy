<svg xmlns="http://www.w3.org/2000/svg" width="810" height="104" viewBox="0 0 810 104">
  <title>A lavender rabbit nibbling a carrot</title>
  <style>
    .rabbit-head {
      transform-origin: 401px 64px;
      animation: nibble 1.1s ease-in-out 4;
    }
    .carrot {
      transform-origin: 460px 76px;
      animation: carrot-bob 1.1s ease-in-out 4;
    }
    .crumb {
      opacity: 0;
      animation: scatter 1.1s ease-out 4;
    }
    .crumb-far { animation-delay: .06s; }
    @keyframes nibble {
      17%, 48% { transform: translate(2px, 2px) rotate(4deg); }
      0%, 32%, 66%, 100% { transform: none; }
    }
    @keyframes carrot-bob {
      17%, 48% { transform: rotate(-7deg); }
      0%, 32%, 66%, 100% { transform: none; }
    }
    @keyframes scatter {
      0%, 15% { opacity: 0; transform: none; }
      22% { opacity: 1; }
      58%, 100% { opacity: 0; transform: translate(8px, 10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .rabbit-head, .carrot, .crumb { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="left-line">
      <stop stop-color="#6488b6" stop-opacity="0"/>
      <stop offset="1" stop-color="#6488b6" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="right-line">
      <stop stop-color="#6488b6" stop-opacity=".65"/>
      <stop offset="1" stop-color="#6488b6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-width="1.4">
    <path d="M12 72h318" stroke="url(#left-line)"/>
    <path d="M488 72h310" stroke="url(#right-line)"/>
  </g>
  <g fill="#74a5dc">
    <circle cx="330" cy="72" r="2.5"/>
    <circle cx="488" cy="72" r="2.5"/>
  </g>

  <ellipse cx="405" cy="94" rx="62" ry="4" fill="#7185a5" opacity=".17"/>
  <g fill="#d4c8ff" stroke="#5b4b88" stroke-width="1.8" stroke-linejoin="round">
    <path d="M363 78c-6 3-14 0-14-6 0-4 4-7 8-6-1-4 2-7 6-6 5 1 8 5 8 10z" fill="#eee6ff"/>
    <path d="M402 87c-5 7-31 8-37 1-7-9-1-25 11-28 14-4 26 4 28 15z"/>
    <path d="M374 89c0-5 7-7 14-5 4 1 8 4 8 7h-19c-2 0-3-1-3-2z" fill="#eee6ff"/>
  </g>

  <g class="carrot" stroke-linecap="round" stroke-linejoin="round">
    <path d="M457 74c4-7 10-8 16-8-3 4-7 7-13 9 6-2 11-1 15 3-6 2-11 1-16-1" fill="#83cd83" stroke="#30634b" stroke-width="1.5"/>
    <path d="M429 67c7 0 20 1 29 4 5 2 4 8-1 10-7 3-22-8-28-14z" fill="#ff9e5c" stroke="#9b4a31" stroke-width="1.7"/>
    <path d="m449 72-2 3m8-1-2 3" fill="none" stroke="#b45d39" stroke-width="1.4"/>
  </g>

  <g class="rabbit-head" stroke="#5b4b88" stroke-width="1.8" stroke-linejoin="round">
    <path d="M386 48c-9-8-17-25-13-34 3-7 9-5 14 2 6 8 8 19 9 28z" fill="#b7a5ec"/>
    <path d="M397 45c-4-10-4-31 2-38 5-6 10-2 12 5 3 10 0 24-4 33z" fill="#d4c8ff"/>
    <path d="M401 38c-2-8-1-21 3-25 3 4 4 15 0 25z" fill="#efa9c9" stroke="none"/>
    <path d="M395 42c13-5 25 2 29 12 2 4 2 7 7 9 4 3 2 9-4 12-10 6-28 5-37-2-10-7-7-25 5-31z" fill="#d4c8ff"/>
    <path d="M415 74c3 2 8 1 12-2" fill="none" stroke-linecap="round"/>
    <ellipse cx="410" cy="67" rx="5" ry="3" fill="#efa9c9" stroke="none"/>
    <circle cx="415" cy="57" r="2.6" fill="#30244e" stroke="none"/>
    <circle cx="416" cy="56" r=".8" fill="#fff" stroke="none"/>
    <path d="M429 62c2 0 4 1 4 2-1 2-3 2-5 1z" fill="#824f80" stroke="none"/>
  </g>

  <path d="M412 78c4-5 12-6 16-2 2 3-1 6-5 6h-8" fill="#eee6ff" stroke="#5b4b88" stroke-width="1.6" stroke-linecap="round"/>
  <circle class="crumb" cx="434" cy="74" r="1.8" fill="#f28a49"/>
  <circle class="crumb crumb-far" cx="438" cy="72" r="1.2" fill="#f5b064"/>
</svg>
